# Portainer stack — SSH (key-only OpenSSH into the sandbox, no web terminal),
# pulling from GHCR.
#
# Portainer → Stacks → Add stack → name it "claude-nas-ssh" → paste this in the
# web editor → fill the Environment variables (below) → Deploy.
#
# Before first start: put your public key(s) in <CONFIG_DIR>/ssh/authorized_keys.
# Connect:            ssh -p <SSH_PORT> claude@your-nas
#
# Env vars to set in Portainer:
#   PUID, PGID                  e.g. 1026 / 100  (run `id` on the NAS)
#   CLAUDE_CODE_OAUTH_TOKEN     from `claude setup-token`
#   WORKSPACE_DIR               /volume1/docker/claude-nas/workspace
#   CONFIG_DIR                  /volume1/docker/claude-nas/config
#   SSH_PORT                    2222

services:
  ssh:
    image: ghcr.io/dluxhu/claude-nas-ssh:latest
    container_name: claude-ssh
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - DISABLE_AUTOUPDATER=1
    ports:
      - "${SSH_PORT:-2222}:2222"
    volumes:
      - ${WORKSPACE_DIR}:/workspace
      - ${CONFIG_DIR}:/config
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [claude-net]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/2222 && head -c 4 <&3 | grep -q SSH"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  claude-net:
    driver: bridge
