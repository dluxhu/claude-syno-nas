# Terminal variant — one image, two doors: the real Claude Code TUI via ttyd
# (web terminal) and/or key-only OpenSSH. Pick with TTYD=1 / SSHD=1 in .env;
# the container refuses to start with neither.
# Deploy:  docker compose -f docker-compose.terminal.yml up -d
# Separate compose project from the chat build, so the two can run side by side.
name: claude-nas-terminal

services:
  terminal:
    # Prebuilt image by default; `docker compose -f docker-compose.terminal.yml up -d --build`
    # rebuilds from ./terminal (EXTRA_PACKAGES only takes effect when building).
    image: ghcr.io/dluxhu/claude-nas-terminal:latest
    build:
      context: ./terminal
      args:
        # Extra apt packages baked in at build time, e.g. EXTRA_PACKAGES="golang htop"
        EXTRA_PACKAGES: ${EXTRA_PACKAGES:-}
    container_name: ${TERMINAL_CONTAINER_NAME:-claude-terminal}
    restart: unless-stopped
    # Run as the NAS user that owns your shared folders (correct file ownership;
    # also keeps everything non-root — sshd included).
    user: "${PUID}:${PGID}"
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      # What starts: TTYD=1 (web terminal), SSHD=1 (key-only OpenSSH), or both.
      - TTYD=${TTYD:-}
      - SSHD=${SSHD:-}
      # REQUIRED when TTYD=1 — the terminal is a shell, so it's behind HTTP basic auth.
      - TTYD_USER=${TTYD_USER:-}
      - TTYD_PASS=${TTYD_PASS:-}
      # bash (default) = shell in /home, type `claude`. claude = jump straight in.
      - TTYD_SHELL=${TTYD_SHELL:-bash}
    ports:
      # Each port only answers if its service is enabled; the other one just
      # refuses connections.
      - "${TTYD_PORT:-7681}:7681"
      - "${SSH_PORT:-2222}:2222"
    volumes:
      # The ONLY directory the container can see — it's $HOME inside. Holds the
      # CLI config/auth, the user-installed agents (install-agents), ssh keys,
      # and your projects (any layout you like, e.g. /home/src).
      - ${HOME_DIR}:/home
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - claude-net
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  claude-net:
    driver: bridge
